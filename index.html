<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cockpit</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <main id="cockpit" class="cockpit">
      <header class="title-bar">
        <h1 id="project-title" class="project-title"></h1>
        <span id="you-are-here-chip" class="here-chip" hidden></span>
      </header>

      <section id="slot-map" class="panel panel-map" aria-label="프로젝트 지도">
        <h2>프로젝트 지도</h2>
        <div class="panel-body map-body"></div>
      </section>

      <aside class="side">
        <section id="slot-now" class="panel panel-side" aria-label="지금">
          <h2>지금</h2>
          <div class="panel-body"></div>
        </section>
        <section id="slot-next" class="panel panel-side" aria-label="다음">
          <h2>다음</h2>
          <div class="panel-body"></div>
        </section>
        <section id="slot-blocked" class="panel panel-side" aria-label="막힌 것">
          <h2>막힌 것</h2>
          <div class="panel-body"></div>
        </section>
      </aside>

      <section id="slot-frame" class="panel panel-context" aria-label="프로젝트 큰 그림">
        <h2>프로젝트 큰 그림</h2>
        <div class="panel-body"></div>
      </section>

      <section id="slot-settled" class="panel panel-context" aria-label="이미 정해진 방향">
        <h2>이미 정해진 방향</h2>
        <div class="panel-body"></div>
      </section>

      <section id="slot-extra" class="panel-context-stack" hidden aria-label="More context">
      </section>

      <p id="empty-state" class="empty-state" hidden></p>
    </main>
  </body>
</html>
