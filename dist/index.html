<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cockpit</title>
    <script type="module" crossorigin src="/assets/index-wgVD7yBN.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-w1oJaztn.css">
  </head>
  <body>
    <main id="cockpit" class="cockpit">
      <header class="title-bar">
        <div class="brand-group">
          <span class="app-tag">Cockpit</span>
          <h1 id="project-title" class="project-title"></h1>
        </div>
        <span id="you-are-here-chip" class="stage-chip" hidden></span>
      </header>

      <div id="primary-workspace" class="primary-workspace">
        <!-- MAP-FIRST: the project map is the mental anchor and comes first. -->
        <section id="slot-map" class="panel panel-map" aria-label="프로젝트 지도">
          <div class="panel-header">
            <div>
              <h2>프로젝트 지도</h2>
            </div>
            <span id="map-completeness-badge" class="completeness-badge" hidden></span>
          </div>
          <div class="panel-body map-body"></div>
        </section>

        <div id="overview-panel" class="overview-panel" aria-label="프로젝트 개요">
          <!-- 지금: 프로젝트 전체가 현재 어떤 상태인지. -->
          <section id="slot-now" class="panel panel-status" aria-label="지금" hidden>
            <div class="panel-header">
              <div>
                <h2>지금</h2>
              </div>
              <span class="surface-note">프로젝트 전체의 현재 상태</span>
            </div>
            <div class="panel-body"></div>
          </section>

          <!-- 다음: 가장 가까운 의미 있는 상태 전환. -->
          <section id="slot-next" class="panel panel-status" aria-label="다음" hidden>
            <div class="panel-header">
              <div>
                <h2>다음</h2>
              </div>
              <span class="surface-note">가장 가까운 상태 전환</span>
            </div>
            <div class="panel-body"></div>
          </section>

          <!-- 막힘: 다음 전환을 제한하는 것이 있을 때만. -->
          <section id="slot-blocked" class="panel panel-status" aria-label="막힘" hidden>
            <div class="panel-header">
              <div>
                <h2>막힘</h2>
              </div>
              <span class="surface-note">다음 전환을 제한하는 제약</span>
            </div>
            <div class="panel-body"></div>
          </section>

          <!-- 최근 변화: 핵심 의미 전환만, 작업 나열이 아님. -->
          <section id="slot-recent" class="panel panel-movement panel-recent" aria-label="최근 변화" hidden>
            <div class="panel-header">
              <div>
                <h2>최근 변화</h2>
              </div>
              <span class="surface-note">현재 진행 문서 기준 · 프로젝트 상태의 핵심 전환</span>
            </div>
            <div class="panel-body"></div>
          </section>
        </div>

        <aside id="inspector-aside" class="universal-inspector-drawer" aria-label="상세 정보 창" hidden>
          <div id="universal-inspector-panel" class="inspector-card panel">
            <div class="inspector-top-bar">
              <div id="inspector-breadcrumb" class="inspector-breadcrumb">개요</div>
              <button id="inspector-close-btn" class="btn-back" type="button" aria-label="프로젝트 개요로 돌아가기">
                개요로 돌아가기
              </button>
            </div>
            <div class="inspector-identity">
              <span id="inspector-group-tag" class="group-tag"></span>
              <span id="inspector-state" class="inspector-state" hidden></span>
            </div>
            <h2 id="inspector-title" class="inspector-title"></h2>
            <div id="inspector-summary" class="inspector-summary"></div>
            <div id="inspector-sections" class="inspector-subsections"></div>
            <div class="inspector-actions">
              <button id="inspector-copy-btn" class="btn-handoff" type="button" hidden
                title="클릭하면 에이전트에게 전달할 검토 내용이 클립보드에 복사됩니다">
                이 영역 검토하기
              </button>
              <span id="copy-toast" class="copy-toast" role="status" aria-live="polite" hidden>✓ 에이전트에게 전달할 내용이 복사되었습니다</span>
              <p id="handoff-hint" class="handoff-hint" hidden>클릭하면 에이전트에게 전달할 검토 내용이 클립보드에 복사됩니다</p>
            </div>
          </div>
        </aside>
      </div>

      <div id="context-region" class="context-region">
        <section id="slot-focus" class="panel panel-context panel-focus" aria-label="현재 집중" hidden>
          <div class="panel-header">
            <div>
              <span class="surface-kicker">작업자 지정</span>
              <h2>현재 집중</h2>
            </div>
          </div>
          <div class="panel-body"></div>
          <div class="focus-actions">
            <button id="focus-copy-btn" class="btn-focus-copy" type="button">
              현재 집중 내용 복사
            </button>
            <span id="focus-copy-toast" class="copy-toast" role="status" aria-live="polite" hidden>✓ 에이전트에게 전달할 내용이 복사되었습니다</span>
          </div>
        </section>

        <div class="stable-context-grid">
          <section id="slot-frame" class="panel panel-context panel-stable" aria-label="제품 목표">
            <h2>제품 목표</h2>
            <div class="panel-body"></div>
          </section>

          <section id="slot-settled" class="panel panel-context panel-stable" aria-label="확정된 방향">
            <h2>확정된 방향</h2>
            <div class="panel-body"></div>
          </section>
        </div>

        <section id="slot-extra" class="panel-context-stack" hidden aria-label="추가 맥락"></section>
      </div>

      <p id="empty-state" class="empty-state" hidden></p>
    </main>
  </body>
</html>
